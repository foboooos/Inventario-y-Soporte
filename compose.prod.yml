services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: inventario-soporte-migrate:prod
    build:
      context: ./backend
      target: production
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      DB_DATABASE: "${POSTGRES_DB:?POSTGRES_DB must be set}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/database/run-migrations.js"]

  backend:
    image: inventario-soporte-backend:prod
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      DB_DATABASE: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "false"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: inventario-soporte-frontend:prod
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
